<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S.O.AI.Deal Mind</title>
<style>
body{font-family:Arial;background:#fff5f8;text-align:center;padding:20px}
.card{background:white;max-width:500px;margin:auto;padding:25px;border-radius:20px;box-shadow:0 5px 20px #ffd6e0}
input,button{width:90%;padding:12px;margin:8px;border-radius:10px;border:1px solid #ddd}
button{background:#ff2d78;color:white;border:none;font-weight:bold}
#result{text-align:left;background:#fff0f5;padding:15px;border-radius:10px;margin-top:15px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="card">
<h1>💖 S.O.AI.Deal Mind</h1>
<p>Voice-first AI copilot - Authentic outfit + Sunday salon rescue + 40% reward</p>
<input id="prompt" placeholder="Ex: I need outfit + salon on Sunday for meeting">
<input id="location" placeholder="Location - ex: Cairo" value="Cairo">
<button onclick="send()">Find My Deal ✨</button>
<div id="result">Your plan will appear here...</div>
</div>
<script>
async function send(){
  let p=document.getElementById('prompt').value;
  let l=document.getElementById('location').value;
  let r=await fetch('/api/v1/orchestrate-lifestyle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p,location:l})});
  let d=await r.json();
  document.getElementById('result').innerText=JSON.stringify(d,null,2);
}
</script>
</body>
</html>
